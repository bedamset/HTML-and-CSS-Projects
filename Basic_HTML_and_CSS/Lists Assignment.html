<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML Lists Example</title>
  <link rel="stylesheet" type="text/css" href="CSS_Lists.css">
</head>
<body>

  <h2>Unordered List</h2>
  <ul>
    <li>Cats</li>
    <li>Dogs</li>
    <li>Birds</li>
    <li>Fish</li>
  </ul>

  <h2>Ordered List</h2>
  <ol>
    <li>Wake up</li>
    <li>Brush teeth</li>
    <li>Have breakfast</li>
    <li>Go to work</li>
  </ol>

</body>
</html>
