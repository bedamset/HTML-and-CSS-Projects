<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Class Styling Example</title>
  <style>
    .font1 {
      background-color: black;
      color: yellow;
      font-size: large;
      padding: 5px;
    }

    .font2 {
      background-color: black;
      color: white;
      font-size: medium;
      padding: 5px;
    }
  </style>
</head>
<body>

  <h2 class="font1">This is an h2 element, styled using class font1</h2>

  <h3 class="font2">This is an h3 element, styled using class font2</h3>

  <h4 class="font1">This is an h4 element, styled the same as h2 using class font1</h4>

</body>
</html>
