<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML Spacing Challenge</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    section {
      background-color: #f0f0f0;
      padding: 10px;
      margin-bottom: 20px;
    }

    span {
      color: blue;
      font-weight: bold;
    }

    p {
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h2>HTML Spacing Example</h2>

  <p>This&nbsp;paragraph&nbsp;uses&nbsp;non-breaking spaces&nbsp;(&nbsp;).</p>

  <section>
    This is a <span>section element</span> with a <span>span element</span> inside.
  </section>

  <p>Copyright symbol example: &copy; 2025 My Website</p>

</body>
</html>
