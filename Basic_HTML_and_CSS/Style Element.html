<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Style Element Example</title>
  <style>
    .myStyle {
      background-color: red;
      color: blue;
      text-decoration: underline;
      font-weight: bold;
      font-size: small;
      padding: 5px;
    }
  </style>
</head>
<body>

  <p class="myStyle">This paragraph is styled using the class "myStyle".</p>

</body>
</html>
