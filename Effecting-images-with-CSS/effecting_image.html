<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Station I Resort</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        /* Container setup */
        .photo-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            border: 2px solid #021a40;
        }

        /* The image itself */
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        /* Overlay styling */
        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.6s ease;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        /* Overlay text */
        .photo-overlay h3 {
            margin: 0 0 10px;
            color: #ff0;
            font-size: 18px;
        }

        .photo-overlay p {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
        }

        /* Hover effects */
        .photo-container:hover img {
            transform: scale(1.3);
        }

        .photo-container:hover .photo-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- PHOTO CONTAINER -->
    <div class="photo-container">
        <img src="C:\Users\pbeda\Documents\GitHub\HTML-and-CSS-Projects\Project\Images\Icons\icons1.jpg" alt="Launch thumbnail">
        <div class="photo-overlay">
            <h3>Click to Enlarge</h3>
            <p>We have several launches departing daily. Book your flight today!</p>
        </div>
    </div>
    <!-- END PHOTO CONTAINER -->

</body>
</html>
