<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Exploration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #ccc;
    }

    nav a {
      text-decoration: none;
      margin: 0 15px;
      font-size: 16px;
      color: #000;
    }

    nav a:hover {
      text-decoration: underline;
    }

    section {
      padding: 40px 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 20px auto;
    }

    .gallery img {
      width: 100%;
      border-radius: 5px;
    }

    form input, form textarea {
      width: 80%;
      padding: 8px;
      margin: 10px auto;
      display: block;
    }

    form button {
      padding: 10px 20px;
      cursor: pointer;
    }

    iframe {
      width: 80%;
      height: 400px;
      margin: 20px auto;
      display: block;
    }

    footer {
      border-top: 1px solid #ccc;
      padding: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- HEADER AND NAVIGATION -->
  <header>
    <h1>Space Exploration</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
      <a href="#video">Video</a>
    </nav>
  </header>

  <!-- HOME SECTION -->
  <section id="home">
    <h2>Welcome to Space Exploration</h2>
    <p>Discover the wonders of space through images, videos, and learn how to get involved in missions of the future!</p>
  </section>

  <!-- GALLERY SECTION -->
  <section id="gallery">
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="Images/Thumb/thumbnail_1.jpeg" alt="Space Image 1">
      <img src="Images/Thumb/thumbnail_2.jpeg" alt="Space Image 2">
      <img src="Images/Thumb/thumbnail_3.jpeg" alt="Space Image 3">
      <img src="Images/Thumb/thumbnail_4.jpeg" alt="Space Image 4">
      <img src="Images/Thumb/thumbnail_5.jpeg" alt="Space Image 5">
      <img src="Images/Thumb/thumbnail_6.jpeg" alt="Space Image 6">
      <img src="Images/Thumb/thumbnail_7.jpeg" alt="Space Image 7">
      <img src="Images/Thumb/thumbnail_8.jpeg" alt="Space Image 8">
    </div>
  </section>

  <!-- CONTACT FORM SECTION -->
  <section id="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" name="name" placeholder="Name">
      <input type="email" name="email" placeholder="Email">
      <textarea name="message" rows="4" placeholder="Your message"></textarea>
      <button type="submit">Submit</button>
    </form>
  </section>

  <!-- VIDEO SECTION -->
  <section id="video">
    <h2>Video</h2>
    <iframe 
      width="560" 
      height="315" 
      src="https://www.youtube.com/embed/-l-bkSxhZSg?si=7Nf_zPM67QwwfhX0" 
      title="YouTube video player" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin" 
      allowfullscreen>
    </iframe>
  </section>

  <!-- FOOTER -->
  <footer>
    &copy; 2025 Space Exploration | HTML Assignment
  </footer>

</body>
</html>
