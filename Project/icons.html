<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Icons Assignment</title>

<style>
    .container {
        width: 450px;
        height: 450px;
        background-color: #faebd7;
        border: 2px solid black;
        border-radius: 10px;
        margin: 20px auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        align-items: center;
        padding: 10px;
    }

    .square {
        width: 100px;
        height: 100px;
        background-color: #fff;
        border: 1px solid black;
        border-radius: 5px;
        margin: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .square:hover {
        transform: scale(1.1);
        border-color: #258;
    }

    .square img {
        width: 50px;
        height: 50px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="square"><img src="C:\Users\pbeda\Documents\GitHub\HTML-and-CSS-Projects\Project\Images\Icons\icons.png"></div>
    <div class="square"><img src="C:\Users\pbeda\Documents\GitHub\HTML-and-CSS-Projects\Project\Images\Icons\icons2.png" alt="Icon 2"></div>
    
</div>

</body>
